    "numba>=0.60.0",
    "numpy>=2.0.2",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pyemd>=2.0.0",
    "pyinstrument>=5.1.2",
    "pyttsx3>=2.99",
]
